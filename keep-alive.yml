# Supabase Keep-Alive
# ------------------------------------------------------------------
# Stops the Supabase free-tier project pausing after ~7 days idle.
# Supabase only counts REAL database queries as activity — visiting
# the dashboard does not count. This runs one tiny SELECT every 2 days.
#
# SETUP (one time):
#   GitHub repo -> Settings -> Secrets and variables -> Actions
#   -> New repository secret, add these two:
#
#     SUPABASE_URL       https://iwopylirxgwsxrnytgjp.supabase.co
#     SUPABASE_ANON_KEY  (the long eyJ... key from supabase-config.js)
#
#   Then: Actions tab -> "Supabase Keep-Alive" -> Run workflow
#   to confirm it goes green before relying on it.
#
# ⚠️ GitHub disables scheduled workflows after 60 days of no repo
#    activity. If you stop committing entirely, this stops too.
#    Push any commit to re-enable it.
# ------------------------------------------------------------------

name: Supabase Keep-Alive

on:
  schedule:
    # 03:00 UTC = 11:00 AM Philippine time, every 2nd day
    - cron: '0 3 */2 * *'
  workflow_dispatch:        # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to reset the inactivity timer
        run: |
          echo "Pinging Supabase..."

          code=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            --max-time 30 \
            "${{ secrets.SUPABASE_URL }}/rest/v1/products?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "HTTP $code"
          echo "Response: $(head -c 200 /tmp/body.txt)"

          if [ "$code" = "200" ]; then
            echo "✅ Project is awake — inactivity timer reset."
            exit 0
          fi

          echo "::error::Keep-alive FAILED with HTTP $code"
          case "$code" in
            000) echo "::error::Could not reach the host. Project may be PAUSED or DELETED." ;;
            401) echo "::error::Bad API key — update the SUPABASE_ANON_KEY secret." ;;
            404) echo "::error::The products table was not found — check the table name." ;;
            5*)  echo "::error::Supabase returned a server error. Check status.supabase.com" ;;
          esac
          exit 1
